name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Placeholder configuration so settings import in CI. None of these are real secrets.
env:
  DJANGO_SECRET_KEY: ci-only-not-a-secret
  DJANGO_ALLOWED_HOSTS: localhost
  DATABASE_URL: postgres://tickets:tickets@localhost:5432/tickets
  S3_ENDPOINT_URL: http://localhost:8333
  S3_BUCKET: ci
  S3_ACCESS_KEY_ID: ci
  S3_SECRET_ACCESS_KEY: ci
  S3_REGION: us-east-1
  S3_ADDRESSING_STYLE: path

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tickets
          POSTGRES_USER: tickets
          POSTGRES_PASSWORD: tickets
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tickets -d tickets"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      - name: Migrations are committed
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing:skip-covered
      - name: Production deploy checks
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-a-long-random-looking-value-for-the-check
        run: uv run python manage.py check --deploy --fail-level WARNING

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build production image
        run: docker build --target prod -t ticket-tracker:ci .
