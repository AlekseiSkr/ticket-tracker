version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Deliberately on the Django 5.2 LTS (support to 2028-04); django-storages has no
      # released 6.x support yet. Only patch releases come through automatically.
      - dependency-name: django
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: django-stubs
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # pyproject pins Python 3.13 (requires-python <3.14); move to 3.14 deliberately.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
