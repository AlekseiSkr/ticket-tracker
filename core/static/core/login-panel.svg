<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice">
  <!-- Login side panel: the khaki 64px grid from the source's CTA cards, lit by the
       lime "lit line" from its method timeline. Decorative; carries no text. -->
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#7b8d72" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="62%" cy="46%" r="62%">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".75" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="900" height="1200" fill="url(#fade)"/></mask>
    <radialGradient id="ground" cx="70%" cy="25%" r="80%">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#060606"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-500%" width="200%" height="1100%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="url(#ground)"/>
  <rect width="900" height="1200" fill="url(#grid)" mask="url(#gridMask)"/>
  <g transform="translate(160 312)">
    <!-- Dim ticks -->
    <g fill="#3c3c3c" opacity=".45">
      <rect y="0" width="30" height="1"/><rect y="24" width="30" height="1"/><rect y="48" width="30" height="1"/>
      <rect y="72" width="30" height="1"/><rect y="96" width="30" height="1"/><rect y="120" width="30" height="1"/>
      <rect y="144" width="30" height="1"/><rect y="168" width="30" height="1"/><rect y="192" width="30" height="1"/>
      <rect y="336" width="30" height="1"/><rect y="360" width="30" height="1"/><rect y="384" width="30" height="1"/>
      <rect y="408" width="30" height="1"/><rect y="432" width="30" height="1"/><rect y="456" width="30" height="1"/>
      <rect y="480" width="30" height="1"/><rect y="504" width="30" height="1"/><rect y="528" width="30" height="1"/>
      <rect y="552" width="30" height="1"/><rect y="576" width="30" height="1"/>
    </g>
    <!-- Lit neighbourhood: +-2 mid, +-1 near, centre glowing -->
    <rect y="216" width="48" height="1" fill="#c3ff00" opacity=".35"/>
    <rect y="240" width="70" height="1" fill="#c3ff00" opacity=".7"/>
    <rect y="264" width="300" height="2" fill="#cbfb2e" filter="url(#glow)"/>
    <rect y="264" width="300" height="1" fill="#cbfb2e"/>
    <rect y="288" width="70" height="1" fill="#c3ff00" opacity=".7"/>
    <rect y="312" width="48" height="1" fill="#c3ff00" opacity=".35"/>
  </g>
</svg>
