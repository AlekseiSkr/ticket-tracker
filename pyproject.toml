[project]
name = "ticket-tracker"
version = "0.1.0"
description = "Support ticket tracker built on the Django admin."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2.18,<5.3",
    "django-unfold==0.110.0",          # 0.x and releases weekly, so pin exactly
    "django-storages[s3]>=1.14.6,<1.15",
    "dj-database-url>=3.0",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.12",
    "argon2-cffi>=23.1",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-django>=4.11",
    "pytest-cov>=6.0",
    "ruff>=0.13",
    "mypy>=1.18",
    "django-stubs[compatible-mypy]>=5.2,<5.3",  # stubs track the Django minor version
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ", "S"]
ignore = ["S101"]  # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # fake credentials in tests

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
# The stress test only runs on demand: pytest -m stress -s (see tests/test_stress.py).
addopts = "--strict-markers -m \"not stress\""
markers = ["stress: slow load test, run with -m stress"]
# WhiteNoise warns that STATIC_ROOT is empty; tests never run collectstatic.
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.coverage.run]
source = ["config", "core", "tickets"]
omit = ["*/migrations/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
# CI fails below this. 95% measured on 2026-10-18 after Phase 2; raise it as coverage grows.
fail_under = 93
